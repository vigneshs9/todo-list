<div class="flex flex-col gap-1">
  <label class="text-sm font-medium text-slate-700">{{ label }}</label>
  <div class="relative">
    <span class="pointer-events-none absolute inset-y-0 left-3 flex items-center text-sky-600 text-lg">📅</span>
    <input type="date" [value]="value" [min]="min" [max]="max" [disabled]="disabled" (change)="onChange($event)"
      class="w-full rounded-xl border border-slate-300 bg-slate-50 py-2 pl-11 pr-3 text-slate-900 transition focus:border-sky-500 focus:ring-2 focus:ring-sky-200 disabled:cursor-not-allowed disabled:bg-slate-100 disabled:text-slate-500" />
  </div>
</div>
