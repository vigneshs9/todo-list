<div class="flex flex-col gap-1">
 <label class="text-sm font-medium text-gray-700">
  {{ label }}
 </label>
 <textarea [rows]="rows" [placeholder]="placeholder" [value]="value" [disabled]="disabled" (input)="onInput($event)"
  class="min-h-[120px] w-full rounded-lg border border-slate-300 bg-slate-50 px-3 py-2 text-slate-900 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-200 disabled:cursor-not-allowed disabled:bg-slate-100 disabled:text-slate-500 resize-vertical"></textarea>

 @if (error) {
 <p class="text-sm text-red-500">
  {{ error }}
 </p>
 }
</div>
