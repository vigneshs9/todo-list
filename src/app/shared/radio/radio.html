<div class="flex flex-wrap gap-3">
 @for (opt of options; track opt.value) {
  <label class="inline-flex items-center gap-3 rounded-full border px-4 py-2 transition cursor-pointer select-none"
    [class]="disabled ? 'opacity-50 cursor-not-allowed' : 'hover:border-blue-300'"
    [attr.aria-checked]="selectedValue === opt.value"
    (click)="select(opt)">
   <span class="relative">
    <span class="w-5 h-5 rounded-full border-2 flex items-center justify-center"
      [class]="selectedValue === opt.value ? 'border-blue-600 bg-blue-100' : 'border-gray-300 bg-white'">
     @if (selectedValue === opt.value) {
      <span class="w-3 h-3 bg-blue-600 rounded-full"></span>
     }
    </span>
   </span>
   <span class="text-sm font-medium" [class]="selectedValue === opt.value ? 'text-blue-700' : 'text-gray-700'">{{ opt.label }}</span>
  </label>
 }
 @if (options.length === 0) {
  <div class="text-sm text-gray-500">No options</div>
 }
</div>
